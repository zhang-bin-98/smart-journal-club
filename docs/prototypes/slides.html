<main id="center" class="flex min-h-0 min-w-0 flex-col" aria-label="幻灯片连续画布"><div class="flex shrink-0 flex-wrap items-center justify-between gap-2 border-b border-line bg-white px-4 py-2.5"><div class="flex items-center gap-2"><button id="undo" class="px-1 py-1 disabled:opacity-30">↶ 撤销</button><button id="redo" aria-label="重做" class="px-1 py-1 disabled:opacity-30">↷</button><span class="text-line">│</span><button id="pageUp" class="text-xs disabled:opacity-30">上移</button><button id="pageDown" class="text-xs disabled:opacity-30">下移</button><button id="mergePage" class="text-xs disabled:opacity-30">合并下一页</button><button id="removePage" class="text-xs disabled:opacity-30">删除本页</button></div><div class="flex items-center gap-3"><button id="focusMode" class="rounded border border-control px-2 py-1.5 text-xs">专注当前页</button><button id="toggleInspector" class="text-xs underline">收起右栏</button></div></div>

<div id="notesShell" class="relative flex shrink-0 flex-col border-t border-line bg-white" style="height:210px"><div id="notesResize" role="separator" aria-label="调整讲稿高度" aria-orientation="horizontal" tabindex="0" title="拖动调整高度，方向键微调" class="absolute -top-1 left-0 z-20 flex h-2 w-full cursor-row-resize touch-none items-center justify-center hover:bg-accent-soft"><span class="h-1 w-10 rounded bg-control"></span></div><div class="flex shrink-0 items-center justify-between gap-2 border-b border-line px-4 py-2.5"><h2 id="notesTitle" class="text-xs font-medium">本页讲稿</h2><div class="flex gap-3 text-xs"><button id="editNotes" class="underline">编辑讲稿</button><button id="assignNotes" class="underline">调整分页</button><button id="collapseNotes" class="text-muted underline">收起</button></div></div><div id="notesContent" class="min-h-0 flex-1 overflow-y-auto px-4 py-3 text-sm leading-relaxed"></div></div></main>

</div>
<div id="aiComposer" class="hidden shrink-0 border-t border-line bg-white px-5 py-3"><div class="mb-2 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><span class="font-medium">AI 助手</span><select id="aiScope" aria-label="AI 修改范围" class="rounded border border-control px-2 py-1 text-xs"><option value="current">当前页</option><option value="selected">所选页面</option><option value="all">整份幻灯片</option></select><select id="aiMode" aria-label="AI 操作模式" class="rounded border border-control px-2 py-1 text-xs"><option value="modify">修改</option><option value="ask">提问</option></select><span id="aiScopeLabel" class="text-xs text-muted"></span></div><button id="hideAi" class="text-xs text-muted underline">收起输入</button></div><div class="flex items-end gap-3"><textarea id="aiInput" rows="2" aria-label="给 AI 的问题或修改要求" placeholder="例如：把图改为上下排列，缩小间距。Ctrl+Enter 发送" class="max-h-28 min-h-0 min-w-0 flex-1 resize-y rounded border border-control px-3 py-2 text-sm leading-relaxed"></textarea><button id="cancelAi" class="hidden rounded border border-control px-3 py-2">取消</button><button id="sendAi" class="rounded bg-ink px-4 py-2 text-white disabled:opacity-30">发送</button></div></div>
<footer class="flex shrink-0 items-center justify-between border-t border-line bg-white px-4 py-2 text-xs text-muted"><span id="footerStatus"></span><div class="flex items-center gap-4"><button id="showAi" class="font-medium text-ink underline">展开 AI 输入</button><span>本地示例 · 未调用模型</span><button id="demoResource" class="underline">演示阻断问题</button><button id="reset" class="underline">重置 Demo</button></div></footer>
</div><div id="toast" role="status" class="pointer-events-none fixed bottom-14 left-1/2 z-50 hidden -translate-x-1/2 rounded bg-ink px-4 py-2 text-white"></div>

<script>
'use strict';
let aiMessages=[],aiProposal=null,aiBusy=false,aiTimer=null,aiEpoch=0;
let exportTimer=null,exportEpoch=0,checkFilter='all';
const $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=value=>structuredClone(value);
const claims=[{id:'c1',text:'处理组的相对细胞响应发生变化'},{id:'c2',text:'单细胞分布提示响应存在异质性'},{id:'c3',text:'组织层面的观察与细胞结果相互支持'},{id:'c4',text:'响应变化与信号通路变化相关'},{id:'c5',text:'功能干预为机制提供支持性证据'},{id:'c6',text:'补充分析检验结果在不同条件下的稳定性'}];
const evidence={
'1b':{label:'Figure 1b',title:'不同条件下的相对响应',quote:'The treatment group showed an altered response across experimental conditions.',legend:'b, Quantification of relative responses for each condition.',location:'Results · 第 3 页，第 2 段',claim:'c1'},
'1c':{label:'Figure 1c',title:'单细胞响应的异质性',quote:'Individual cells occupied distinct regions of the response space.',legend:'c, Projection of individual cells onto the first two components.',location:'Results · 第 3 页，第 3 段',claim:'c2'},
'2b':{label:'Figure 2b',title:'组织层面的定量验证',quote:'The tissue-level measurements supported the observed cellular response.',legend:'b, Quantification of the response in tissue samples.',location:'Results · 第 5 页，第 1 段',claim:'c3'},
'3b':{label:'Figure 3b',title:'通路读出的变化',quote:'The response was associated with changes in pathway activity.',legend:'b, Relative pathway activity across conditions.',location:'Results · 第 7 页，第 2 段',claim:'c4'},
'3d':{label:'Figure 3d',title:'功能干预与时间变化',quote:'Perturbation of the pathway modified the response over time.',legend:'d, Time-course response following pathway perturbation.',location:'Results · 第 7 页，第 4 段',claim:'c5'},
'4b':{label:'Supplementary Figure S4b',title:'不同条件下的稳定性',quote:'The additional analyses examined the stability of the response across conditions.',legend:'b, Additional comparisons across experimental conditions.',location:'Results · 第 9 页，第 2 段',claim:'c6'}};
function segment(id,purpose,text,refs){return {id,purpose,text,refs};}
const seed=[
{id:'s0',title:'背景与研究问题',track:'main',purpose:'先交代研究缺口，让听众知道作者为什么做这项研究。',segments:[segment('p0','提出问题','这篇论文关注肿瘤微环境中的细胞如何响应干预。过去的研究提示总体响应会改变，但不同细胞是否一致、这种变化与哪些机制相关，仍然不清楚。接下来我们沿着细胞表型、组织验证和机制干预展开。',[])]},
{id:'s1',title:'发现一：细胞响应与异质性',track:'main',purpose:'讲清总体变化，再解释为什么仅看平均值还不够。',segments:[segment('p1','先展示总体响应','首先看 Figure 1b，作者比较了不同实验条件下的相对细胞响应。处理组与对照组的读出存在差异，提示干预改变了细胞响应。不过，仅凭这一组比较还不能断言变化由某条特定通路直接引起，需要结合后续机制实验。Figure 2b 的组织观察提供了另一层面的支持，但不能直接等同于细胞读出。',['1b','2b']),segment('p2','从平均值转向细胞差异','接下来，Figure 1c 把观察单位从总体平均转向单个细胞。细胞分布并不完全一致，说明总体变化背后可能包含不同的响应状态。因此，后续需要同时考虑群体差异与细胞异质性，不能用一个平均值概括所有细胞。',['1c'])]},
{id:'s2',title:'发现二：组织层面验证',track:'main',purpose:'检查前面的细胞结果能否得到另一层面的支持。',segments:[segment('p3','连接细胞与组织证据','Figure 2b 进一步展示了组织样本中的定量结果。这一步为前面的细胞观察提供了另一层面的支持，但组织中的关联与单细胞层面的响应不能直接画等号。我们需要结合取样、对照以及实验条件来理解二者的关系。',['2b'])]},
{id:'s3',title:'发现三：机制与功能干预',track:'main',purpose:'区分通路关联与功能干预分别能支持到什么程度。',segments:[segment('p4','先说明关联证据','Figure 3b 显示响应变化伴随通路活性改变。这说明二者相关，为机制解释提供了线索。这里应当保留关联的表述，不把同步变化直接当作因果关系。',['3b']),segment('p5','再看干预证据','在 Figure 3d 中，作者进一步干预候选通路并观察时间变化。与单纯比较不同，功能干预为机制提供了更强的支持。不过，这是否足以证明唯一机制，还要结合干预特异性、替代解释和论文的实验边界。',['3d'])]},
{id:'s4',title:'综合结论与局限',track:'main',purpose:'把几组发现连起来，并明确可支持的结论边界。',segments:[segment('p6','收束主线','综合以上结果，这篇研究从总体响应、细胞差异和组织验证出发，进一步用通路分析与功能干预建立解释链条。汇报的重点不是罗列每张图，而是说明不同证据如何相互支持。对机制唯一性与适用范围的判断仍应保持谨慎。',['1b','2b','3d'])]},
{id:'s5',title:'补充：稳定性与方法细节',track:'supplement',purpose:'充分保留论文发现，便于问答或按听众需要展开。',segments:[segment('p7','保留补充发现','Supplementary Figure S4b 展示了额外条件下的比较，用于检查结果的稳定性。这部分可以放在补充材料，在讨论不同实验条件或方法细节时展开。放入补充并不意味着删掉这项发现，它仍应被纳入完整汇报。',['4b'])]}];

const key='smartjc-slides-demo-v1';
const sections=seed.map(({segments,...s})=>s);
const initialFragments=seed.flatMap(s=>s.segments.flatMap(p=>(p.text.match(/[^。！？]+[。！？]?/g)||[p.text]).map((text,i)=>({id:p.id+'-'+i,paragraphId:p.id,sectionId:s.id,purpose:p.purpose,text,refs:p.refs}))));
const ids=(paragraphId)=>initialFragments.filter(f=>f.paragraphId===paragraphId).map(f=>f.id);
const makePage=(id,sectionId,title,message,speechIds,panels)=>({id,sectionId,title,message,speechIds,panels:panels.map(ref=>({ref,weight:1})),arrangement:'auto',gap:12});
const initial={fragments:initialFragments,slides:[
 makePage('d0','s0','研究问题：细胞如何响应干预？','从总体响应走向异质性与机制解释',ids('p0'),[]),
 makePage('d1','s1','干预改变了相对细胞响应','细胞与组织观察提供不同层面的支持',ids('p1').slice(0,2),['1b','2b']),
 makePage('d2','s1','平均响应不能概括全部细胞','从总体差异进一步观察细胞异质性',[...ids('p1').slice(2),...ids('p2')],['1b','1c']),
 makePage('d3','s2','组织观察支持细胞层面的结果','跨层面证据相互支持，但不能直接等同',ids('p3'),['2b']),
 makePage('d4','s3','通路与干预共同支持机制解释','关联与干预回答不同问题，保留实验边界',[...ids('p4'),...ids('p5')],['3b','3d']),
 makePage('d5','s4','多层证据构成完整解释链','表型 → 验证 → 机制；结论保留实验边界',ids('p6'),['1b','2b','3d']),
 makePage('d6','s5','补充分析检查结果稳定性','可按叙事需要提前展示附图',ids('p7'),['4b'])]};
let state=clone(initial),current='d1',tab='group',selectedPanel=null,focusOnly=false,checked=new Set(),undo=[],redo=[],draft=null,dragPage=null,dragPanel=null,toastTimer=null;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.version===1){validate(saved.state);state=saved.state;current=state.slides[0]?.id;}}catch{}
const page=()=>state.slides.find(s=>s.id===current);
const fragment=id=>state.fragments.find(f=>f.id===id);
const section=id=>sections.find(s=>s.id===id);
const pageIndex=id=>state.slides.findIndex(s=>s.id===id);
const unassigned=()=>{const assigned=new Set(state.slides.flatMap(s=>s.speechIds));return state.fragments.filter(f=>!assigned.has(f.id));};
function validate(s){
 if(!s||!Array.isArray(s.slides)||!Array.isArray(s.fragments))throw Error('invalid state');
 const fragments=new Set(s.fragments.map(f=>f.id));
 if(fragments.size!==s.fragments.length)throw Error('duplicate fragment');
 const assigned=new Set();const slides=new Set();
 for(const p of s.slides){if(slides.has(p.id)||!sections.some(s=>s.id===p.sectionId))throw Error('invalid page');slides.add(p.id);for(const id of p.speechIds){if(!fragments.has(id)||assigned.has(id))throw Error('invalid assignment');assigned.add(id);}if(new Set(p.panels.map(p=>p.ref)).size!==p.panels.length||p.panels.some(p=>!evidence[p.ref]))throw Error('invalid panel');}
}
function notify(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600);}
function persist(){try{localStorage.setItem(key,JSON.stringify({version:1,state}));$('saveStatus').textContent='✓ 已保存在此浏览器';}catch{$('saveStatus').textContent='仅本次有效 · 无法写入浏览器';}}
function beginDraft(){invalidateAiForEdit();if(!draft)draft=clone(state);$('saveStatus').textContent='编辑中…';}
function saveDraft(){if(!draft)return;const before=draft;draft=null;if(JSON.stringify(before)!==JSON.stringify(state)){validate(state);undo.push(before);if(undo.length>30)undo.shift();redo=[];persist();renderNav();renderStatus();}else $('saveStatus').textContent='内容未改变';}
function mutate(action){invalidateAiForEdit();saveDraft();const before=clone(state);action();validate(state);undo.push(before);if(undo.length>30)undo.shift();redo=[];if(!page())current=state.slides[0]?.id;checked=new Set([...checked].filter(id=>state.slides.some(s=>s.id===id)));persist();renderAll();}
function replay(from,to){invalidateAiForEdit();saveDraft();if(!from.length)return;to.push(clone(state));state=from.pop();if(!page())current=state.slides[0]?.id;checked.clear();persist();renderAll();}
function activate(id){if(!state.slides.some(s=>s.id===id)||id===current)return;saveDraft();current=id;selectedPanel=null;renderNav();renderNotes();renderInspector();renderStatus();document.querySelectorAll('[data-slide]').forEach(el=>{el.classList.toggle('border-focus',el.dataset.slide===current);el.classList.toggle('border-line',el.dataset.slide!==current);});}
function navigate(id){activate(id);if(focusOnly)renderSlides();const target=document.querySelector('[data-slide="'+id+'"]');if(target){const root=$('canvasScroll');root.scrollTop+=target.getBoundingClientRect().top-root.getBoundingClientRect().top-8;}}
function chart(ref){
 let marks='';
 if(ref.endsWith('d'))marks='<path d="M44 132l48 -12 46 4 45 -44 42 -6 37 -32" fill="none" stroke="#374151" stroke-width="3"/><path d="M44 137l48 -7 46 3 45 -17 42 3 37 -9" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="5 4"/>';
 else if(ref.endsWith('c'))marks=Array.from({length:30},(_,i)=>'<circle cx="'+(49+i*47%246)+'" cy="'+(39+i*31%97)+'" r="3" fill="'+(i%2?'#9ca3af':'#374151')+'"/>').join('');
 else marks=[0,1,2,3,4].map(n=>'<rect x="'+(61+n*47)+'" y="'+(107-n*12+(n%2)*20)+'" width="25" height="'+(39+n*12-(n%2)*20)+'" fill="'+(n%2?'#9ca3af':'#e5e7eb')+'" stroke="#6b7280"/>').join('');
 return '<svg viewBox="0 0 340 180" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+esc(evidence[ref].label)+' 示例图" class="h-full w-full"><rect width="340" height="180" fill="white"/><text x="10" y="20" font-size="17" fill="#374151">'+esc(ref.slice(-1))+'</text><path d="M40 30v116h265" fill="none" stroke="#6b7280"/>'+marks+'<text x="170" y="167" text-anchor="middle" font-size="10" fill="#6b7280">Illustrative data</text></svg>';
}
function groupStyle(p){const cols=p.arrangement==='stack'?1:p.arrangement==='row'?Math.max(1,p.panels.length):Math.min(2,Math.max(1,p.panels.length));const weights=Array.from({length:cols},(_,i)=>p.panels[i]?.weight||1);return 'grid-template-columns:'+weights.map(w=>'minmax(0,'+w+'fr)').join(' ')+';grid-template-rows:repeat('+Math.ceil(Math.max(1,p.panels.length)/cols)+',minmax(0,1fr));gap:'+p.gap+'px';}
function renderNav(){
 $('pageNav').innerHTML=state.slides.map((p,i)=>'<div draggable="true" data-drag-page="'+p.id+'" class="mb-4 rounded border '+(current===p.id?'border-focus bg-white':'border-transparent')+' p-2"><div class="mb-2 flex items-center gap-2 text-xs text-muted"><input type="checkbox" data-check="'+p.id+'" aria-label="选择第 '+(i+1)+' 页" '+(checked.has(p.id)?'checked':'')+'><span class="cursor-grab" title="拖动页面调序">⠿</span><button data-nav="'+p.id+'" class="flex-1 text-left">'+(i+1)+' · '+(section(p.sectionId).track==='main'?'主线':'补充')+'</button></div><button data-nav="'+p.id+'" aria-current="'+(current===p.id?'true':'false')+'" class="block w-full text-left"><div class="flex aspect-video flex-col justify-between overflow-hidden border border-line bg-white p-2"><span class="line-clamp-2 text-[10px] font-medium">'+esc(p.title)+'</span><span class="flex gap-1">'+p.panels.map(t=>'<span class="h-5 min-w-0 flex-1 border border-control bg-canvas"></span>').join('')+'</span></div><span class="mt-2 block text-xs leading-snug">'+esc(p.title)+'</span><span class="mt-1 block text-[10px] text-muted">'+esc(section(p.sectionId).title)+'</span></button></div>').join('')||'<p class="p-2 text-xs text-muted">暂无页面，可以新增。</p>';
}
function renderSlides(){

$('inspectorContent').ondragend=()=>dragPanel=null;
let scrollFrame=0;
$('canvasScroll').addEventListener('scroll',()=>{if(scrollFrame||focusOnly||dragPage||dragPanel||$('dialog').open)return;scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;const root=$('canvasScroll').getBoundingClientRect();const anchor=root.top+Math.min(100,root.height*.25);const node=[...document.querySelectorAll('[data-slide]')].find(el=>el.getBoundingClientRect().bottom>anchor);if(node)activate(node.dataset.slide);});});
let rightWidth=320,notesHeight=210,rightVisible=true,notesOpen=true,resize=null;
try{const saved=JSON.parse(localStorage.getItem(key+'-view'));if(saved){rightWidth=Number(saved.rightWidth)||320;notesHeight=Number(saved.notesHeight)||210;}}catch{}
function layout(){const width=$('workspace').getBoundingClientRect().width;rightWidth=Math.max(280,Math.min(width-200-420,rightWidth));$('workspace').style.gridTemplateColumns=rightVisible?'200px minmax(0,1fr) '+rightWidth+'px':'200px minmax(0,1fr)';notesHeight=Math.max(120,Math.min($('center').clientHeight*.48,notesHeight));$('notesShell').style.height=notesOpen?notesHeight+'px':'42px';$('notesContent').hidden=!notesOpen;$('notesResize').hidden=!notesOpen;$('splitter').setAttribute('aria-valuenow',String(Math.round(rightWidth)));$('splitter').setAttribute('aria-valuemin','280');$('splitter').setAttribute('aria-valuemax',String(Math.round(width-620)));$('notesResize').setAttribute('aria-valuenow',String(Math.round(notesHeight)));}
function saveView(){try{localStorage.setItem(key+'-view',JSON.stringify({rightWidth,notesHeight}));}catch{}}
function startResize(kind,e){if(e.button!==0)return;e.preventDefault();saveDraft();resize={kind,pointer:e.pointerId,width:rightWidth,height:notesHeight};e.currentTarget.setPointerCapture(e.pointerId);document.body.style.userSelect='none';}
function moveResize(e){if(!resize)return;if(resize.kind==='right')rightWidth=$('workspace').getBoundingClientRect().right-e.clientX;else notesHeight=$('center').getBoundingClientRect().bottom-e.clientY;layout();}
function endResize(cancel=false){if(!resize)return;const last=resize;resize=null;if(cancel){rightWidth=last.width;notesHeight=last.height;}const handle=$(last.kind==='right'?'splitter':'notesResize');if(handle.hasPointerCapture(last.pointer))handle.releasePointerCapture(last.pointer);document.body.style.userSelect='';layout();if(!cancel)saveView();}
for(const [id,kind] of [['splitter','right'],['notesResize','notes']]){const el=$(id);el.onpointerdown=e=>startResize(kind,e);el.onpointermove=moveResize;el.onpointerup=e=>{moveResize(e);endResize();};el.onpointercancel=()=>endResize(true);el.onlostpointercapture=()=>endResize(true);el.ondblclick=()=>{if(kind==='right')rightWidth=320;else notesHeight=210;layout();saveView();};el.onkeydown=e=>{if(e.key==='Escape'){endResize(true);return;}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();if(kind==='right')rightWidth=e.key==='Home'?320:rightWidth+(e.key==='ArrowLeft'?10:e.key==='ArrowRight'?-10:0);else notesHeight=e.key==='Home'?210:notesHeight+(e.key==='ArrowUp'?10:e.key==='ArrowDown'?-10:0);layout();saveView();};}
$('toggleInspector').onclick=()=>{saveDraft();rightVisible=!rightVisible;$('inspector').classList.toggle('hidden',!rightVisible);$('toggleInspector').textContent=rightVisible?'收起右栏':'展开右栏';layout();};
$('collapseNotes').onclick=()=>{notesOpen=!notesOpen;$('collapseNotes').textContent=notesOpen?'收起':'展开';layout();};
window.addEventListener('resize',layout);
$('nextStep').onclick=exportDeckDemo;
$('reset').onclick=()=>{cancelAi(false);aiMessages=[];aiProposal=null;state=clone(initial);current='d1';selectedPanel=null;tab='group';focusOnly=false;checked.clear();undo=[];redo=[];draft=null;persist();renderAll();navigate(current);};
window.addEventListener('beforeunload',()=>{if(draft)persist();});
document.addEventListener('keydown',e=>{if($('dialog').open||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?replay(redo,undo):replay(undo,redo);}});

function aiTargets(){return $('aiScope').value==='all'?state.slides.map(p=>p.id):$('aiScope').value==='selected'?[...checked].filter(id=>state.slides.some(p=>p.id===id)):current?[current]:[];}
function updateAiScope(){const ids=aiTargets();$('aiScopeLabel').textContent=ids.length?'第 '+ids.map(id=>pageIndex(id)+1).join('、')+' 页':'尚未选择页面';$('sendAi').disabled=aiBusy||!ids.length;$('cancelAi').classList.toggle('hidden',!aiBusy);}
function openAi(){saveDraft();$('aiComposer').classList.remove('hidden');if(!rightVisible){rightVisible=true;$('inspector').classList.remove('hidden');$('toggleInspector').textContent='收起右栏';}tab='ai';renderInspector();updateAiScope();layout();$('aiInput').focus();}
function aiBase(ids){return JSON.stringify(ids.map(id=>{const p=state.slides.find(p=>p.id===id);return p?{page:p,position:pageIndex(id),speech:p.speechIds.map(fragment)}:null;}));}
function cancelAi(show=true){if(!aiBusy)return;clearTimeout(aiTimer);aiEpoch++;aiBusy=false;if(show)aiMessages.push({role:'assistant',text:'已取消这次请求，页面未改变。'});updateAiScope();if(tab==='ai')renderAi();}
function invalidateAiForEdit(){cancelAi();if(aiProposal){aiProposal.stale=true;if(tab==='ai')renderAi();}}
function renderAi(follow=false){
 const proposal=aiProposal;
 if(proposal&&aiBase(proposal.ids)!==proposal.base)proposal.stale=true;
 const names={row:'横向并排',stack:'上下排列',grid:'两列网格',auto:'自动排列'};
 $('inspectorContent').innerHTML='<div class="mb-4 flex items-center justify-between"><h2 class="font-medium">AI 对话</h2><span class="text-xs text-muted">固定规则演示</span></div><p class="mb-4 text-xs leading-relaxed text-muted">真实应用可通过对话修改内容、讲稿、分页和图组。本 Demo 演示提问及排列、间距、屏幕文字精简；不调用模型。</p><div role="log" aria-live="polite" class="space-y-4">'+(aiMessages.length?aiMessages.map(m=>'<article class="rounded border border-line '+(m.role==='user'?'bg-canvas':'bg-white')+' p-3"><p class="mb-2 text-xs text-muted">'+(m.role==='user'?'你':'AI · 演示')+'</p><p class="whitespace-pre-wrap text-sm leading-relaxed">'+esc(m.text)+'</p></article>').join(''):'<p class="text-sm text-muted">可以提问，也可以描述希望怎样修改页面。</p>')+'</div>'+(aiBusy?'<p role="status" class="mt-4 text-xs text-muted">正在准备演示回复…</p>':'')+(proposal?'<section id="aiProposalPreview" class="mt-5 border-t border-line pt-4"><h3 class="font-medium">修改预览 · '+esc(proposal.label)+'</h3><p class="mt-2 text-xs text-muted">仅修改下列字段，讲稿与图源保持原样。</p>'+proposal.changes.map(c=>'<article class="mt-3 rounded border border-line p-3"><p class="mb-2 text-xs font-medium">'+esc(c.label)+'</p>'+Object.entries(c.patch).map(([field,value])=>'<div class="mb-3"><p class="text-xs text-muted">'+({arrangement:'图组排列',gap:'图间距',message:'屏幕文字'}[field])+'</p><p class="mt-1 whitespace-pre-wrap text-xs text-muted">原：'+esc(field==='arrangement'?names[c.before[field]]:c.before[field])+'</p><p class="mt-1 whitespace-pre-wrap text-sm">建议：'+esc(field==='arrangement'?names[value]:value)+'</p></div>').join('')+'</article>').join('')+(proposal.stale?'<p class="mt-3 text-xs leading-relaxed">稿件已编辑，这条建议已过期。请根据当前稿重新提出修改。</p>':'')+'<div class="mt-4 flex gap-3"><button id="applyAi" '+(proposal.stale?'disabled':'')+' class="rounded bg-ink px-3 py-2 text-xs text-white disabled:opacity-30">应用修改</button><button id="discardAi" class="rounded border border-control px-3 py-2 text-xs">放弃</button></div></section>':'')+'<button id="openAiInput" class="mt-5 text-xs underline">在底部输入问题或修改要求</button>';
 if(follow){const container=$('inspectorContent'),preview=$('aiProposalPreview');container.scrollTop=preview?container.scrollTop+preview.getBoundingClientRect().top-container.getBoundingClientRect().top:container.scrollHeight;}
}
function sendAi(){
 saveDraft();const prompt=$('aiInput').value.trim();const ids=aiTargets();if(!prompt){notify('请输入问题或修改要求。');return;}if(!ids.length||aiBusy)return;
 const mode=$('aiMode').value,base=aiBase(ids),label='第 '+ids.map(id=>pageIndex(id)+1).join('、')+' 页';
 aiProposal=null;aiMessages.push({role:'user',text:label+' · '+(mode==='ask'?'提问':'修改')+'\n'+prompt});if(aiMessages.length>20)aiMessages.splice(0,aiMessages.length-20);
 aiBusy=true;const epoch=++aiEpoch;openAi();updateAiScope();$('aiInput').value='';renderAi(true);
 aiTimer=setTimeout(()=>{if(!aiBusy||epoch!==aiEpoch)return;aiBusy=false;if(base!==aiBase(ids)){aiMessages.push({role:'assistant',text:'稿件在处理中发生变化，请按当前稿重新发送。'});updateAiScope();if(tab==='ai')renderAi();return;}
 if(mode==='ask'){
  const pages=ids.map(id=>state.slides.find(p=>p.id===id));
  aiMessages.push({role:'assistant',text:'演示回复：这个范围有 '+pages.length+' 页、'+pages.reduce((n,p)=>n+p.panels.length,0)+' 个图像引用和 '+pages.reduce((n,p)=>n+p.speechIds.length,0)+' 个讲述片段。相关 Panel 为 '+[...new Set(pages.flatMap(p=>p.panels.map(t=>evidence[t.ref].label)))].join('、')+'。\n这是固定的范围摘要，尚未理解或回答自由问题；真实问答需要模型接入。页面未改变。'});
 }else{
  const arrangement=/上下|纵向/.test(prompt)?'stack':/并排|横向/.test(prompt)?'row':/网格|两列/.test(prompt)?'grid':null;
  const gap=/间距/.test(prompt)?(/缩小|紧凑|减小/.test(prompt)?6:/增大|加大|宽松/.test(prompt)?20:null):null;
  const compact=/精简|简短/.test(prompt)&&!/讲稿/.test(prompt);
  const changes=ids.map(id=>{const p=state.slides.find(s=>s.id===id),patch={};if(arrangement&&p.arrangement!==arrangement&&p.panels.length>1)patch.arrangement=arrangement;if(gap!==null&&p.gap!==gap&&p.panels.length>1)patch.gap=gap;if(compact){const text=p.message.split(/[；;。\n]/)[0].trim();if(text&&text!==p.message)patch.message=text;}return{id,label:'第 '+(pageIndex(id)+1)+' 页 · '+p.title,before:clone(p),patch};}).filter(c=>Object.keys(c.patch).length);
  if(changes.length){aiProposal={ids,base,label,changes,stale:false};aiMessages.push({role:'assistant',text:'已按演示规则准备建议，请查看下方差异。尚未应用到页面；其他自由修改要求未由模型执行。'});}
  else aiMessages.push({role:'assistant',text:'这条要求没有产生可演示的修改。可试“把图改为上下排列，缩小间距”或“精简屏幕文字”。自由改写讲稿、分页等能力待模型接入；当前页面未改变。'});
 }
 updateAiScope();if(tab==='ai')renderAi(true);},700);
}
function applyAi(){const proposal=aiProposal;if(!proposal||proposal.stale||draft||aiBase(proposal.ids)!==proposal.base){if(proposal)proposal.stale=true;renderAi();return;}aiProposal=null;mutate(()=>proposal.changes.forEach(c=>Object.assign(state.slides.find(p=>p.id===c.id),c.patch)));aiMessages.push({role:'assistant',text:'已应用到'+proposal.label+'，可用工具栏“撤销”整体恢复。'});renderAi();}
$('showAi').onclick=openAi;$('hideAi').onclick=()=>{$('aiComposer').classList.add('hidden');layout();$('showAi').focus();};
$('aiScope').onchange=updateAiScope;$('sendAi').onclick=sendAi;$('cancelAi').onclick=()=>cancelAi();
$('aiInput').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!e.isComposing){e.preventDefault();sendAi();}};


function checkItems(){
 const result=[];
 for(const p of state.slides){
  if(p.demoMissingRef&&p.panels.some(t=>t.ref===p.demoMissingRef))result.push({id:p.id+'-resource',pageId:p.id,kind:'block',title:'图源未就绪',detail:evidence[p.demoMissingRef].label+' 的导出图像尚未就绪。恢复原图即可，不改讲稿或图组。',resource:true});
  if(p.demoOverflow)result.push({id:p.id+'-overflow',pageId:p.id,kind:'block',title:'内容超出页面，必须处理',detail:'正文或图组超出可容纳范围，导出会截断内容。请先修复版式或调整分页；不能作为普通提醒放行。本项为固定模拟。',overflow:true});
  if(p.panels.length>=3)result.push({id:p.id+'-size',pageId:p.id,kind:'advice',title:'图组较多，留意标签可读性',detail:'可在当前画布调整图组或分页。这是示例建议，不阻止导出。'});
  if(!p.title.trim())result.push({id:p.id+'-title',pageId:p.id,kind:'advice',title:'页面标题为空',detail:'可以直接在画布补充标题。这是内容建议，不阻止导出。'});
 }
 if(unassigned().length)result.push({id:'speech-unassigned',kind:'advice',title:unassigned().length+' 句讲述待安排',detail:'删页保留的讲述仍在待安排列表，请按汇报需要处理；没有自动记为用户省略。',speech:true});
 return result;
}
function refreshChecks(){
 const items=checkItems(),blocks=items.filter(i=>i.kind==='block').length;
 $('checkTab').textContent=blocks?'检查 '+blocks:'检查';
 $('checkTab').title=blocks?blocks+' 项必须修复；其他为内容建议':items.length+' 条内容建议，不阻止导出';
 $('nextStep').disabled=!state.slides.length;
 $('nextStep').classList.toggle('opacity-30',!state.slides.length);
 $('nextStep').title=!state.slides.length?'先创建幻灯片':blocks?'点击定位阻止导出的问题':'自动检查当前稿后导出';
 $('demoResource').disabled=!page();
 for(const p of state.slides){const row=document.querySelector('[data-drag-page="'+p.id+'"]'),card=document.querySelector('[data-slide="'+p.id+'"]'),count=items.filter(i=>i.pageId===p.id).length;for(const el of [row,card]){if(!el)continue;let badge=el.querySelector('[data-check-marker]');if(!count){badge?.remove();continue;}if(!badge){badge=document.createElement('span');badge.dataset.checkMarker=p.id;badge.className='block px-2 py-1 text-xs text-muted';el.append(badge);}badge.textContent=(p.demoOverflow?'内容超出页面 · 演示 · ':'')+count+' 项检查提示';}}
 if(tab==='check')renderChecks();
}
function showChecks(){saveDraft();rightVisible=true;$('inspector').classList.remove('hidden');$('toggleInspector').textContent='收起右栏';tab='check';renderInspector();refreshChecks();layout();}
function renderChecks(){
 const all=checkItems(),items=all.filter(i=>checkFilter==='all'||i.kind===checkFilter);
 $('inspectorContent').innerHTML='<div class="mb-4 flex justify-between"><h2 class="font-medium">稿件检查</h2></div><p class="mb-4 text-xs leading-relaxed text-muted">随当前稿更新，点击问题定位画布。必须修复项未解决时不能下载。主动删图、覆盖不足只提醒；覆盖情况在大纲与演讲稿查看。</p><div class="mb-5 flex gap-3">'+[['all','全部'],['block','阻止导出'],['advice','内容建议']].map(([id,label])=>'<button data-check-filter="'+id+'" aria-pressed="'+(checkFilter===id)+'" class="rounded border border-control px-2 py-1 text-xs '+(checkFilter===id?'bg-ink text-white':'')+'">'+label+'</button>').join('')+'</div>'+(!state.slides.length?'<p class="mb-4">还没有幻灯片，请先创建页面。</p>':'')+(items.length?items.map(i=>'<article class="mb-4 rounded border '+(i.pageId===current?'border-focus':'border-line')+' p-3"><span class="mb-2 block text-xs text-muted">'+(i.pageId?'第 '+(pageIndex(i.pageId)+1)+' 页 · ':'')+(i.kind==='block'?'阻止导出':'内容建议')+'</span>'+(i.pageId?'<button data-check-page="'+i.pageId+'" class="mb-3 text-left font-medium underline">'+esc(i.title)+'</button>':'<h3 class="mb-3 font-medium">'+esc(i.title)+'</h3>')+'<p class="mb-3 text-xs leading-relaxed">'+esc(i.detail)+'</p>'+(i.resource?'<button data-restore-resource="'+i.pageId+'" class="rounded bg-ink px-3 py-2 text-xs text-white">恢复图源</button>':'')+(i.overflow?'<button data-fix-overflow="'+i.pageId+'" class="rounded bg-ink px-3 py-2 text-xs text-white">预览版式修复</button>':'')+(i.speech?'<button id="arrangeCheckedSpeech" class="text-xs underline">安排讲述</button>':'')+'</article>').join(''):'<p class="mb-5 leading-relaxed">当前分类没有问题。可继续编辑或直接导出。</p>')+'<a href="outline-speech.html" class="text-xs underline">返回大纲查看发现覆盖</a><p class="mt-5 text-xs leading-relaxed text-muted">本 Demo 只检查示例图源状态、模拟页面溢出、空标题、图组数量和未分配讲述；不执行真实 PDF、科学事实或导出几何校验。</p>';
}
function exportDeckDemo(){
 saveDraft();const items=checkItems();if(!state.slides.length)return;
 if(items.some(i=>i.kind==='block')){checkFilter='block';showChecks();const first=items.find(i=>i.kind==='block');navigate(first.pageId);notify('请先处理检查标签中的必须修复项。');return;}
 const snapshot=clone(state),token=++exportEpoch;let step=0;
 const phases=['检查当前稿件','整理图像与讲者备注','打包 PPTX'];
 openDialog('导出 PPTX · 演示','<p role="status" id="exportProgress">准备当前稿件…</p><p class="mt-4 text-xs text-muted">固定 '+snapshot.slides.length+' 页及对应讲稿快照。本 Demo 不生成文件。</p>',[{id:'cancelExport',label:'取消',action:closeDialog}]);
 function advance(){if(token!==exportEpoch)return;if(step<phases.length){$('exportProgress').textContent=phases[step++]+'…';exportTimer=setTimeout(advance,450);return;}$('dialogTitle').textContent='导出流程演示完成';$('exportProgress').textContent='没有生成 PPTX 文件；真实导出将在应用实现阶段接入。';$('cancelExport').textContent='返回编辑';}
 advance();
}

function previewOverflowFix(id){
 const target=state.slides.find(p=>p.id===id);if(!target)return;
 const base=JSON.stringify(state);
 openDialog('版式修复预览 · 演示','<p class="mb-4">第 '+(pageIndex(id)+1)+' 页 · '+esc(target.title)+'</p><p class="mb-3">当前：内容超出页面，可能被截断。</p><p>候选：恢复可容纳的版式；保留全部屏幕文字、Panel 与讲稿。</p><p class="mt-4 text-xs text-muted">本 Demo 只切换模拟溢出状态；真实系统需依据导出几何重新排版或分页，不能只消除提示。</p>',[{id:'discardOverflow',label:'放弃',action:closeDialog},{id:'applyOverflow',label:'应用修复',primary:true,action:()=>{if(JSON.stringify(state)!==base){closeDialog();notify('稿件已变化，请重新预览。');return;}closeDialog();mutate(()=>state.slides.find(p=>p.id===id).demoOverflow=false);notify('模拟版式已修复，检查已更新。');}}]);
}
$('demoResource').onclick=()=>{
 const target=page();if(!target)return;const id=target.id;
 const actions=[{id:'demoOverflow',label:'页面放不下',primary:true,action:()=>{closeDialog();mutate(()=>state.slides.find(p=>p.id===id).demoOverflow=true);checkFilter='block';showChecks();}}];
 if(target.panels.length)actions.push({id:'demoMissingImage',label:'必需图源未就绪',action:()=>{closeDialog();mutate(()=>{const p=state.slides.find(p=>p.id===id);p.demoMissingRef=p.panels[0].ref;});checkFilter='block';showChecks();}});
 openDialog('演示必须处理的问题','<p>选择当前页的模拟问题，查看检查标签、下载拦截和修复过程。</p>',actions);
};


renderAll();layout();navigate(current);
if(location.hash==='#check')showChecks();
</script></body></html>
