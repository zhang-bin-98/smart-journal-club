function renderDetail(){
 const i=current();if(rightTab==='ai'){$('detail').innerHTML='<h2 class="mb-3 font-medium">AI 对话 · 演示</h2><p class="mb-5 text-xs leading-relaxed text-muted">可询问当前问题或请求修复。回复使用固定示例；实际修改仍需预览后应用。</p>'+(aiBusy?'<p role="status">正在准备演示回复…</p>':aiReply?'<p class="mb-4 text-xs text-muted">'+esc(aiReply.title)+'</p><p class="whitespace-pre-wrap leading-relaxed">'+esc(aiReply.text)+'</p>':'<p class="text-muted">从底部输入问题或修改要求。</p>');return;}
 if(!i){$('detail').innerHTML='<h2 class="mb-3 font-medium">检查范围与导出</h2><p class="leading-relaxed text-muted">资源、引用与布局通过后，可从顶栏导出。内容建议不要求逐项确认。</p><p class="mt-5 text-xs leading-relaxed text-muted">PPTX 将保留可编辑文字、等比图像及对应讲者备注；本讨论稿只演示状态，不生成文件。</p>';return;}
 if(filter==='coverage'){$('detail').innerHTML='<h2 class="mb-4 font-medium">已识别发现的汇报去向</h2><p class="mb-4">主线 4 项 · 补充 1 项 · 用户省略 1 项</p><p class="mb-5 text-xs leading-relaxed text-muted">省略有明确的用户决定和原因；未提取或未建立关联的内容不计入“用户省略”。</p><h3 class="mb-3 font-medium">当前发现 · '+esc(i.track)+'</h3><p class="mb-5 leading-relaxed">'+(i.reason?esc(i.reason):'在讲稿与第 '+esc(i.pages)+' 页可以找到相应讲述和证据。')+'</p><button data-action="locate" class="mb-6 text-xs underline">查看对应讲述位置</button><details class="border-t border-line pt-5"><summary class="cursor-pointer font-medium">原文关联待复核 · 1 处</summary><p class="mt-4 text-xs leading-relaxed">示例：PDF 第 8 页 Discussion 第 2 段尚未建立明确发现关联。需核对上下文，不能直接判定遗漏了发现。</p><p class="mt-3 text-xs text-muted">原文示意：Additional conditions may influence the response.</p><a href="figure-review.html" class="mt-4 block text-xs underline">返回论文与图源工作台</a></details>';return;}
 $('detail').innerHTML='<span class="mb-3 block text-xs text-muted">'+(i.kind==='block'?'阻止导出':'内容建议 · 不阻止导出')+'</span><h2 class="mb-5 text-lg font-medium">'+esc(i.title)+'</h2><h3 class="mb-2 font-medium">原因</h3><p class="mb-5 leading-relaxed">'+esc(i.reason)+'</p><h3 class="mb-2 font-medium">影响</h3><p class="mb-5 leading-relaxed">'+esc(i.impact)+'</p>'+(i.fix?'<button data-action="fix" '+(busy?'disabled':'')+' class="mb-4 w-full rounded bg-ink px-3 py-2.5 text-white disabled:opacity-30">'+esc(i.fix)+'</button>':'<a href="slides.html" class="mb-5 block underline">返回幻灯片调整</a>')+'<button data-action="source" class="mb-6 text-xs underline">查看对应图注与正文</button><div class="border-t border-line pt-5 text-xs leading-relaxed text-muted">'+(i.kind==='block'?'修复后重新检查，列表会移除已解决项。已有内容不会被后台改写。':'可以保留此建议直接导出，无需点击“忽略”或逐项确认。')+'</div>';

function openDialog(title,body,actions){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialogActions').replaceChildren();for(const a of actions){const b=document.createElement('button');b.id=a.id;b.textContent=a.label;b.className='rounded border border-control px-4 py-2'+(a.primary?' bg-ink text-white':'');b.onclick=a.run;$('dialogActions').append(b);}if(!$('dialog').open)$('dialog').showModal();}

function exportDemo(){if($('export').disabled)return;const revision=state.revision,token=++epoch;let step=0;const stages=['准备导出快照','整理图像与讲者备注','打包 PPTX'];$('dialog').dataset.exporting='true';function tick(){if(token!==epoch)return;if(step<stages.length){openDialog('正在导出 · 演示','<p class="mb-4">固定稿件 v'+revision+' · '+state.pages+' 页</p><p role="status">'+stages[step++]+'…</p><p class="mt-4 text-xs text-muted">演示不会创建或下载文件。</p>',[{id:'cancelExport',label:'取消',run:closeDialog}]);timer=setTimeout(tick,450);return;}delete $('dialog').dataset.exporting;if(state.scenario==='failure')openDialog('导出演示失败','<p>打包未完成，稿件和已完成的检查仍保留。</p><p class="mt-4 text-xs text-muted">这是模拟的可重试故障；重试演示将完成流程。</p>',[{id:'leaveExport',label:'返回检查',run:closeDialog},{id:'retryExport',label:'重试',primary:true,run:()=>{state.scenario='ready';save();render();exportDemo();}}]);else openDialog('导出流程演示完成','<p>已演示稿件 v'+revision+' 的导出过程。</p><p class="mt-4 text-xs text-muted">没有生成 PPTX 文件；真实导出由后续应用实现。</p>',[{id:'finishExport',label:'返回检查',primary:true,run:closeDialog}]);}tick();}
function select(id){cancelAi();selected=id;render();$('preview').scrollTop=0;$('detail').scrollTop=0;}
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){cancelAi();filter=b.dataset.filter;selected=null;render();}};

$('pageView').onclick=()=>{view='page';render();};$('sourceView').onclick=()=>{view='source';render();};
$('detail').onclick=e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='fix')repair();if(a==='source'){view='source';render();}if(a==='locate'){const i=current();openDialog('讲述定位 · '+i.title,'<p class="leading-relaxed">'+(i.reason?'本项已按用户决定省略，未编入当前讲稿。':esc(i.title)+'：对应第 '+esc(i.pages)+' 页讲述，来源 '+esc(i.label)+'。')+'</p><p class="mt-4 text-xs text-muted">本 Demo 为独立示例，返回编辑页不会定位到真实共用稿件。</p>',[{id:'closeLocate',label:'关闭',run:closeDialog}]);}};
$('undo').onclick=()=>{if(!history.length||busy)return;const nextRevision=state.revision+1;cancelAi();state=history.pop();state.revision=nextRevision;save();render();};$('recheck').onclick=recheck;$('export').onclick=exportDemo;$('closeDialog').onclick=closeDialog;$('dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
function scenario(value){epoch++;clearTimeout(timer);busy=false;cancelAi();state=clone(initial);state.scenario=value;if(value!=='normal'){state.asset=true;state.layout=true;}if(value==='clean')state.advice=true;if(value==='stale')state.revision=2;if(value==='empty')state.pages=0;history=[];filter=(value==='ready'||value==='failure')?'advice':'block';selected=null;aiReply=null;save();render();}
$('scenario').onchange=e=>scenario(e.target.value);$('reset').onclick=()=>scenario('normal');
function showAi(){rightTab='ai';$('aiComposer').classList.remove('hidden');render();$('aiInput').focus();}
$('showAi').onclick=showAi;$('aiTab').onclick=showAi;$('detailTab').onclick=()=>{rightTab='detail';render();};$('hideAi').onclick=()=>{$('aiComposer').classList.add('hidden');$('showAi').focus();};
$('sendAi').onclick=()=>{const i=current(),prompt=$('aiInput').value.trim();if(!i||!prompt||aiBusy)return;aiBusy=true;const id=i.id;aiReply=null;$('cancelAi').classList.remove('hidden');rightTab='ai';render();$('aiInput').value='';aiTimer=setTimeout(()=>{aiBusy=false;$('cancelAi').classList.add('hidden');if(selected!==id)return;aiReply={title:i.title,text:'你：'+prompt+'\n\nAI · 固定示例说明：'+(i.reason||'此项发现的汇报去向已在覆盖列表标出。')+'\n'+(i.fix?'可以切换到“问题详情”，预览并应用修复。':i.impact||'覆盖情况仅统计已识别发现。')+'\n\n本回复不理解自由问题，也没有修改稿件；真实问答需要接入模型。'};render();},500);};$('cancelAi').onclick=()=>{cancelAi();aiReply={title:'请求已取消',text:'稿件未改变。'};render();};$('aiInput').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!e.isComposing){e.preventDefault();$('sendAi').click();}};
let rightWidth=344;function resize(width){rightWidth=Math.max(280,Math.min(520,width));$('workspace').style.gridTemplateColumns='252px minmax(0,1fr) '+rightWidth+'px';$('splitter').setAttribute('aria-valuenow',rightWidth);}
$('splitter').onpointerdown=e=>{if(e.button!==0)return;const x=e.clientX,w=rightWidth;$('splitter').setPointerCapture(e.pointerId);$('splitter').onpointermove=m=>resize(w+x-m.clientX);$('splitter').onpointerup=()=>{$('splitter').onpointermove=null;};};$('splitter').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();resize(rightWidth+(e.key==='ArrowLeft'?16:-16));}};$('splitter').ondblclick=()=>resize(344);
resize(344);render();
</script></body></html>
